<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CentriTruck / LogiTech</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Container */
        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
        }

        /* Card Frame */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            border-radius: 16px;
            padding: 36px 32px 32px 32px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Header area with Title & Logo */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }

        .header-text h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .header-text p {
            font-size: 13.5px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* Image Logo Container */
        .logo-box {
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Toggle Tabs */
        .tab-switcher {
            background-color: #f8fafc;
            border-radius: 30px;
            padding: 4px;
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            border: 1px solid #f1f5f9;
        }

        .tab-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 24px;
            border: none;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: transparent;
            color: #94a3b8;
        }

        .tab-btn.active {
            background-color: #0d0d0d;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13.5px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 46px;
            background-color: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 8px;
            padding: 0 16px 0 42px;
            font-size: 14px;
            color: #334155;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .form-input::placeholder {
            color: #cbd5e1;
            font-weight: 400;
        }

        .form-input:focus {
            background-color: #ffffff;
            border-color: #cbd5e1;
        }

        /* Options Row (Remember / Forgot) */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
            margin-bottom: 22px;
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            color: #94a3b8;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        .remember-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 4px;
            appearance: none;
            outline: none;
            cursor: pointer;
            position: relative;
            background-color: #ffffff;
        }

        .remember-label input[type="checkbox"]:checked {
            background-color: #0d0d0d;
            border-color: #0d0d0d;
        }

        /* Primary Submit Button */
        .btn-submit {
            width: 100%;
            height: 48px;
            background-color: #0d0d0d;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #262626;
        }

        /* Links & Footer */
        .forgot-link {
            font-size: 13.5px;
            font-weight: 600;
            color: #d97706;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .back-link-wrapper {
            margin-top: 32px;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #d97706;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .footer-text {
            margin-top: 24px;
            color: #475569;
            font-size: 12px;
            text-align: center;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Header Row -->
            <div class="header-row">
                <div class="header-text">
                    <h1>Welcome Back</h1>
                    <p>Sign in to access your dashboard</p>
                </div>

                <!-- Logo Image Placeholder -->
                <div class="logo-box">
                    <img 
                        src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=150&auto=format&fit=crop&q=80" 
                        alt="LogiTech Logo" 
                        class="logo-img"
                    >
                </div>
            </div>

            <!-- Role Switcher -->
            <div class="tab-switcher">
                <button class="tab-btn active" id="adminTab" type="button" onclick="switchRole('admin')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <circle cx="12" cy="10" r="3"/>
                    </svg>
                    Login as Admin
                </button>
                <button class="tab-btn" id="driverTab" type="button" onclick="switchRole('driver')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <circle cx="12" cy="12" r="3"/>
                        <line x1="12" y1="3" x2="12" y2="9"/>
                        <line x1="12" y1="15" x2="12" y2="21"/>
                        <line x1="3" y1="12" x2="9" y2="12"/>
                    </svg>
                    Login as Driver
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Hidden Input to track current role -->
                <input type="hidden" id="userRole" name="role" value="admin">

                <!-- Username / Email Field -->
                <div class="form-group">
                    <label class="form-label" id="usernameLabel">Username or Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" class="form-input" id="usernameInput" placeholder="admin@centritruck.com" value="admin@centritruck.com" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" class="form-input" id="passwordInput" placeholder="Enter your password" required>
                    </div>
                </div>

                <!-- Options Row -->
                <div class="options-row">
                    <label class="remember-label">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span id="submitBtnText">Sign In as Admin</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- Back to Home Link -->
            <div class="back-link-wrapper">
                <a href="#" class="back-link">
                    &larr; Back to Home
                </a>
            </div>
        </div>

        <!-- Footer Copyright -->
        <div class="footer-text">
            &copy; 2026 Owens Trucking Services. All rights reserved.
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Track state
        let currentRole = 'admin';

        function switchRole(role) {
            currentRole = role;

            const adminTab = document.getElementById('adminTab');
            const driverTab = document.getElementById('driverTab');
            const usernameInput = document.getElementById('usernameInput');
            const usernameLabel = document.getElementById('usernameLabel');
            const submitBtnText = document.getElementById('submitBtnText');
            const userRoleInput = document.getElementById('userRole');

            if (role === 'driver') {
                // Style Active Tab
                adminTab.classList.remove('active');
                driverTab.classList.add('active');

                // Update Input Fields & Labels for Driver
                usernameLabel.textContent = 'Driver ID or Email';
                usernameInput.placeholder = 'driver@centritruck.com';
                usernameInput.value = 'driver@centritruck.com';
                submitBtnText.textContent = 'Sign In as Driver';
                userRoleInput.value = 'driver';
            } else {
                // Style Active Tab
                driverTab.classList.remove('active');
                adminTab.classList.add('active');

                // Update Input Fields & Labels for Admin
                usernameLabel.textContent = 'Username or Email';
                usernameInput.placeholder = 'admin@centritruck.com';
                usernameInput.value = 'admin@centritruck.com';
                submitBtnText.textContent = 'Sign In as Admin';
                userRoleInput.value = 'admin';
            }
        }

        // Form Submit Handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;

            // Handle logic according to role
            if (currentRole === 'driver') {
                alert(`Driver Login Request:\nUser: ${username}\nRedirecting to Driver Portal...`);
                // Example redirect: window.location.href = '/driver-dashboard.html';
            } else {
                alert(`Admin Login Request:\nUser: ${username}\nRedirecting to Admin Portal...`);
                // Example redirect: window.location.href = '/admin-dashboard.html';
            }
        });
    </script>
</body>
</html>
