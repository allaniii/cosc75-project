<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password · CentriTruck</title>
    <script type="module" crossorigin src="./assets/reset-password-Debc8Da7.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/dom-B0CXGCmh.js">
    <link rel="stylesheet" crossorigin href="./assets/dom-CN4zQz5b.css">
  </head>
  <body>
    <main class="login-panel" style="min-height: 100vh">
      <section class="login-box">
        <h1>Reset Password</h1>
        <p class="muted">
          Request a recovery email, or enter a new password after opening your
          recovery link.
        </p>
        <div id="message" role="status"></div>
        <form id="recovery-form">
          <label
            >Email<input
              type="email"
              name="email"
              required
              autocomplete="email" /></label
          ><button class="button">Send Recovery Link</button>
        </form>
        <form id="password-form" hidden>
          <label
            >New Password<input
              type="password"
              name="password"
              minlength="12"
              autocomplete="new-password"
              required /></label
          ><label
            >Confirm Password<input
              type="password"
              name="confirm"
              minlength="12"
              autocomplete="new-password"
              required /></label
          ><button class="button">Update Password</button>
        </form>
        <p class="section">
          <a class="subtle-link" href="login.html">Back to sign in</a>
        </p>
      </section>
    </main>
  </body>
</html>
